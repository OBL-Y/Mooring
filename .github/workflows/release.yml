name: Release

# Push a tag to build the Windows and macOS installers and attach them to a GitHub release:
#   v0.1.0-beta.1  -> published pre-release (for testing)
#   v0.1.0         -> draft release (check, then publish by hand)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Mac signing, best first:
      # 1. Developer ID (APPLE_* secrets): signed and notarized, no Gatekeeper prompt.
      # 2. Mooring's own certificate (MAC_SIGNING_* secrets): every build has the same
      #    signature, so macOS keeps Accessibility and login-item approval across updates.
      # 3. Ad-hoc, so macOS offers "Open Anyway" instead of calling the app damaged.
      - name: Set up macOS signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_SIGNING_CERTIFICATE: ${{ secrets.MAC_SIGNING_CERTIFICATE }}
          MAC_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$name<<END_OF_$name"; printenv "$name"; echo "END_OF_$name"; } >> "$GITHUB_ENV"
            done
            echo "Signing with a Developer ID"
          elif [ -n "$MAC_SIGNING_CERTIFICATE" ]; then
            # Tauri only imports Apple-issued certificates, so load this one ourselves
            # and let Tauri find it by name in the keychain search list.
            keychain="$RUNNER_TEMP/mooring-signing.keychain-db"
            keychain_password="$(openssl rand -hex 16)"
            echo "$MAC_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/mooring.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/mooring.p12" -k "$keychain" -P "$MAC_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/mooring.p12"
            echo "APPLE_SIGNING_IDENTITY=Mooring Code Signing" >> "$GITHUB_ENV"
            echo "Signing with Mooring's own certificate"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No signing secrets set; ad-hoc signing"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files and latest.json that the in-app updater downloads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Mooring ${{ github.ref_name }}
          releaseBody: |
            See the assets below to download and install Mooring.

            [Code signing policy](https://github.com/OBL-Y/Mooring#code-signing-policy) · [Privacy policy](https://github.com/OBL-Y/Mooring/blob/main/PRIVACY.md)
          # Test tags like v0.1.0-beta.1 publish straight away as a pre-release;
          # version tags like v0.1.0 make a draft to check before publishing.
          releaseDraft: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
